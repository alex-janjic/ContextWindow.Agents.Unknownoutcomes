name: build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: contextwindow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d contextwindow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CW_POSTGRES: Host=localhost;Port=5432;Database=contextwindow;Username=fixture;Password=fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test against dedicated disposable PostgreSQL
        run: dotnet test ContextWindow.Agents.UnknownOutcomes.slnx --configuration Release
      - name: Pack
        run: dotnet pack src/ContextWindow.Agents.UnknownOutcomes --configuration Release
